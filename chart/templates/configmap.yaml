apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "hdmi-multiviewer-proxy.fullname" . }}
  labels:
    {{- include "hdmi-multiviewer-proxy.labels" . | nindent 4 }}
data:
  SERIAL_PORT: {{ .Values.serial.port | quote }}
  SERIAL_BAUD_RATE: {{ .Values.serial.baudRate | quote }}
  SERIAL_TIMEOUT: {{ .Values.serial.timeout | quote }}
  SERIAL_HEARTBEAT_INTERVAL: {{ .Values.serial.heartbeatInterval | quote }}
  SERIAL_RECONNECT_BACKOFF_MAX: {{ .Values.serial.reconnectBackoffMax | quote }}
  SERVER_PORT: {{ .Values.service.port | quote }}
  LOG_LEVEL: {{ .Values.logging.level | quote }}
  LOG_JSON: {{ .Values.logging.json | quote }}
  # --- MQTT (v0.2+) ---
  MQTT_ENABLED: {{ .Values.mqtt.enabled | default "false" | quote }}
  MQTT_HOST: {{ .Values.mqtt.host | default "mqtt" | quote }}
  MQTT_PORT: {{ .Values.mqtt.port | default "1883" | quote }}
  MQTT_CLIENT_ID: {{ .Values.mqtt.clientId | default "hdmi-multiviewer-proxy" | quote }}
  MQTT_TOPIC_PREFIX: {{ .Values.mqtt.topicPrefix | default "multiviewer" | quote }}
  MQTT_KEEPALIVE: {{ .Values.mqtt.keepalive | default "60" | quote }}
  MQTT_QOS: {{ .Values.mqtt.qos | default "0" | quote }}
  POLL_INTERVAL: {{ .Values.mqtt.pollInterval | default "10.0" | quote }}
  # --- HA discovery (v0.2+) ---
  HA_DISCOVERY_ENABLED: {{ .Values.ha.discoveryEnabled | default "true" | quote }}
  HA_DISCOVERY_PREFIX: {{ .Values.ha.discoveryPrefix | default "homeassistant" | quote }}
  HA_DEVICE_NAME: {{ .Values.ha.deviceName | default "HDMI Multiviewer" | quote }}
  HA_DEVICE_ID: {{ .Values.ha.deviceId | default "hdmi_multiviewer" | quote }}
  # Which multiviewer model this instance drives. The supported models are NOT
  # command-compatible (the UHD takes `power z!`, the HDS `s power z!`, and the
  # HDS has no volume/HDCP/VKA/ITC commands at all). `r type!` returns the same
  # string on both, so it cannot be auto-detected -- set it per instance.
  DEVICE_PROFILE: {{ .Values.deviceProfile | default "uhd401mv" | quote }}
